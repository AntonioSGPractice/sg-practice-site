<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SG Practice</title>
<meta name="description" content="Book a 30-minute discovery call with SG Practice. We'll identify your offer, audience, and booking goal.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  @font-face {
    font-family: 'HelveticaNowDisplay';
    src: url('HelveticaNowDisplay-Cn.otf') format('opentype');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #FFFFFF;
    --border: #E0E0E0;
    --border-2: #BBBBBB;
    --text: #0A0A0A;
    --text-3: #999999;
    --text-4: #CCCCCC;
    --font-display: 'HelveticaNowDisplay', 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'HelveticaNowDisplay', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'SF Mono', Menlo, Consolas, monospace;
    --container: 1240px;
    --gutter: 2.5rem;
    --nav-h: 72px;
    --foot-h: 52px;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    flex-direction: column;
  }

  ::selection { background: var(--text); color: var(--bg); }
  a { text-decoration: none; color: inherit; }

  /* ===== NAV ===== */
  nav {
    flex-shrink: 0;
    width: 100%;
    z-index: 100;
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    height: var(--nav-h);
  }
  .nav-inner {
    max-width: var(--container);
    margin: 0 auto;
    height: 100%;
    padding: 0 var(--gutter);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    color: var(--text);
    transition: opacity 0.3s;
  }
  .logo:hover { opacity: 0.75; }
  .nav-links { display: flex; gap: 2.4rem; align-items: center; }
  .nav-link { font-size: 0.88rem; font-weight: 400; color: var(--text-3); transition: color 0.3s; letter-spacing: 0.06em; text-transform: uppercase; }
  .nav-link:hover { color: var(--text); }

  /* ===== MOBILE TOGGLE ===== */
  .mobile-toggle { display: none; background: none; border: none; cursor: pointer; padding: 10px; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 13px); right: 1.25rem; z-index: 115; width: 44px; height: 44px; }
  .mobile-toggle span { display: block; width: 22px; height: 1.5px; background: var(--text); margin: 5px auto; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.3s; transform-origin: center; }
  .mobile-toggle.active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .mobile-toggle.active span:nth-child(2) { opacity: 0; }
  .mobile-toggle.active span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
  .mobile-menu { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 105; background: rgba(255,255,255,0.98); backdrop-filter: blur(40px) saturate(140%); -webkit-backdrop-filter: blur(40px) saturate(140%); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: env(safe-area-inset-top, 0) 2rem env(safe-area-inset-bottom, 0); opacity: 0; visibility: hidden; transition: opacity 0.45s cubic-bezier(0.16,1,0.3,1), visibility 0.45s; }
  .mobile-menu.open { opacity: 1; visibility: visible; }
  .mobile-menu a { font-family: var(--font-display); display: block; font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; color: var(--text); padding: 0.6rem 0; opacity: 0; transform: translateY(12px); transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1), transform 0.5s cubic-bezier(0.16,1,0.3,1), color 0.3s; }
  .mobile-menu.open a { opacity: 1; transform: translateY(0); }
  .mobile-menu.open a:nth-of-type(1) { transition-delay: 0.10s; }
  .mobile-menu.open a:nth-of-type(2) { transition-delay: 0.20s; }
  .mobile-menu.open a:nth-of-type(3) { transition-delay: 0.30s; }
  .mobile-menu.open a:nth-of-type(4) { transition-delay: 0.40s; }
  .mobile-menu .mm-foot { position: absolute; bottom: 2.5rem; left: 2rem; font-size: 0.78rem; color: var(--text-3); opacity: 0; transition: opacity 0.5s 0.45s; font-family: var(--font-mono); }
  .mobile-menu.open .mm-foot { opacity: 1; }

  /* ===== MAIN ===== */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 2rem var(--gutter) 0;
  }

  /* ===== BOOKING WRAP ===== */
  .booking-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    animation: rise 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
  }
  .calendly-inline-widget {
    flex: 1;
    width: 100% !important;
    min-width: 320px;
    height: 100% !important;
    box-shadow: none !important;
    filter: none !important;
    overflow: hidden !important;
  }
  .calendly-inline-widget iframe {
    width: 100% !important;
    height: 100% !important;
    box-shadow: none !important;
    filter: none !important;
    border: none !important;
    overflow: hidden !important;
    scrollbar-width: none !important;
    display: block;
  }
  .calendly-inline-widget iframe::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

  /* ===== FOOTER ===== */
  footer {
    flex-shrink: 0;
    width: 100%;
    height: var(--foot-h);
    padding: 0 var(--gutter);
    border-top: 0.5px solid var(--border);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 2rem;
  }
  .f-l { font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-3); font-weight: 500; text-transform: uppercase; }
  .f-c { display: flex; justify-content: center; }
  .f-c a { color: var(--text-3); transition: color 0.3s; display: flex; align-items: center; }
  .f-c a:hover { color: var(--text); }
  .f-c svg { width: 18px; height: 18px; fill: currentColor; }
  .f-r { text-align: right; }
  .f-r a { font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-3); font-weight: 500; transition: color 0.3s; }
  .f-r a:hover { color: var(--text); }

  /* ===== ANIMATIONS ===== */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== MOBILE ===== */
  @media (max-width: 820px) {
    :root { --gutter: 1.25rem; --nav-h: 62px; --foot-h: 48px; }
    html, body { height: auto; min-height: 100%; overflow: visible; }
    body { display: block; }
    .nav-links { display: none; }
    .mobile-toggle { display: block; }
    main { flex: none; display: block; height: auto; overflow: visible; padding: 1rem 1.25rem 1.5rem; }
    .booking-wrap { flex: none; display: block; height: auto; overflow: visible; }
    .calendly-inline-widget { height: auto !important; overflow: visible !important; }
    .calendly-inline-widget iframe { height: 700px !important; min-height: 700px; overflow: auto !important; -webkit-overflow-scrolling: touch; }
    footer { grid-template-columns: 1fr auto 1fr; height: auto; padding: 0.9rem 1.25rem; }
    .f-l, .f-r a { font-size: 0.72rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">SG Practice</a>
    <div class="nav-links">
      <a href="index.html#services" class="nav-link">Services</a>
      <a href="index.html#results" class="nav-link">Selected Work</a>
      <a href="index.html#process" class="nav-link">Process</a>
    </div>
  </div>
</nav>
<button class="mobile-toggle" id="mobileToggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>

<div class="mobile-menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Main menu">
  <a href="index.html#services">Services</a>
  <a href="index.html#results">Selected Work</a>
  <a href="index.html#process">Process</a>
  <div class="mm-foot">contact@sg-practice.com</div>
</div>

<main>
  <div class="booking-wrap">
    <div class="calendly-inline-widget" data-url="https://calendly.com/contact-sg-practice/discovery-call?background_color=ffffff&text_color=0a0a0a&primary_color=999999&hide_gdpr_banner=1" style="min-width:320px;"></div>
    <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
    <script>
      (function() {
        var attempts = 0;
        var iv = setInterval(function() {
          var iframe = document.querySelector('.calendly-inline-widget iframe');
          if (iframe) {
            var isMobile = window.matchMedia('(max-width: 820px)').matches;
            iframe.setAttribute('scrolling', isMobile ? 'yes' : 'no');
            iframe.style.overflow = isMobile ? 'auto' : 'hidden';
            clearInterval(iv);
          }
          if (++attempts > 40) clearInterval(iv);
        }, 250);
      })();
    </script>
  </div>
</main>

<footer>
  <div class="f-l">© 2026 — SG Practice</div>
  <div class="f-c"><a href="https://www.linkedin.com/company/sgpractice/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a></div>
  <div class="f-r"><a href="mailto:contact@sg-practice.com">contact@sg-practice.com</a></div>
</footer>

<script>
  var mobileToggle = document.getElementById('mobileToggle');
  var mobileMenu = document.getElementById('mobileMenu');
  function setMenu(open) {
    mobileToggle.classList.toggle('active', open);
    mobileMenu.classList.toggle('open', open);
    mobileToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  mobileToggle.addEventListener('click', function() { setMenu(!mobileMenu.classList.contains('open')); });
  mobileMenu.querySelectorAll('a').forEach(function(link) { link.addEventListener('click', function() { setMenu(false); }); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && mobileMenu.classList.contains('open')) setMenu(false); });
</script>
</body>
</html>

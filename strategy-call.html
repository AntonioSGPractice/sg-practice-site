<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Book a strategy call — SG Practice</title>
<meta name="description" content="Book a 30-minute strategy call with SG Practice. We'll audit your pipeline and identify the highest-leverage gaps.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0A0A0B;
    --bg-2: #0E0E10;
    --card: #111114;
    --border: #1F1F23;
    --border-2: #2A2A30;
    --text: #F4F4F5;
    --text-2: #B4B4BB;
    --text-3: #7E7E86;
    --text-4: #4E4E55;
    --font-display: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace;
    --container: 1240px;
    --gutter: 2.5rem;
  }

  html { scroll-behavior: smooth; font-size: 16px; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    font-feature-settings: "ss01", "cv11";
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  ::selection { background: var(--text); color: var(--bg); }
  a { text-decoration: none; color: inherit; }

  /* ===== NAV ===== */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(10,10,11,0.82);
    backdrop-filter: blur(32px) saturate(140%);
    -webkit-backdrop-filter: blur(32px) saturate(140%);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: var(--container);
    margin: 0 auto;
    height: 72px;
    padding: 0 var(--gutter);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    display: inline-flex;
    align-items: baseline;
    gap: 0.45rem;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
    transition: opacity 0.3s;
  }
  .logo:hover { opacity: 0.75; }
  .nav-back {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.96rem;
    font-weight: 400;
    color: var(--text-3);
    letter-spacing: -0.005em;
    transition: color 0.3s;
  }
  .nav-back:hover { color: var(--text); }
  .nav-back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); }
  .nav-back:hover svg { transform: translateX(-3px); }

  /* ===== MAIN ===== */
  main {
    position: relative;
    z-index: 2;
    flex: 1;
    max-width: var(--container);
    width: 100%;
    margin: 0 auto;
    padding: 9rem var(--gutter) 6rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Page header */
  .page-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1.6rem;
    margin-bottom: 3.5rem;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
  }
  .page-index {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-4);
    white-space: nowrap;
  }
  .page-title-block { display: block; }
  .page-title-block h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(2.6rem, 5vw, 4.2rem);
    line-height: 1.04;
    letter-spacing: -0.04em;
    color: var(--text);
  }
  .page-title-block h1 .h1-thin {
    font-weight: 300;
    color: var(--text-2);
    letter-spacing: -0.038em;
  }
  .page-body {
    font-size: 1.12rem;
    font-weight: 400;
    line-height: 1.7;
    color: var(--text-2);
    max-width: 480px;
    letter-spacing: -0.005em;
    padding-top: 0.4rem;
  }

  /* CTA button */
  .cta-wrap {
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    background: var(--text);
    color: var(--bg);
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.02rem;
    letter-spacing: -0.01em;
    padding: 1.1rem 1.8rem;
    border-radius: 999px;
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), background 0.3s, color 0.3s;
    border: 1px solid var(--text);
  }
  .cta-btn:hover { transform: translateY(-2px); background: #FFFFFF; }
  .cta-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); }
  .cta-btn:hover svg { transform: translateX(3px); }

  .cta-note {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-4);
  }

  /* ===== FOOTER ===== */
  footer {
    position: relative;
    z-index: 2;
    max-width: var(--container);
    width: 100%;
    margin: 0 auto;
    padding: 3rem var(--gutter) 3.5rem;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 2rem;
  }
  .f-l { font-family: var(--font-mono); font-size: 0.86rem; color: var(--text-3); font-weight: 500; letter-spacing: 0; text-transform: uppercase; }
  .f-c { display: flex; justify-content: center; }
  .f-c a { color: var(--text-3); transition: color 0.3s; display: flex; align-items: center; }
  .f-c a:hover { color: var(--text); }
  .f-c svg { width: 20px; height: 20px; fill: currentColor; }
  .f-r { text-align: right; }
  .f-r a { font-family: var(--font-mono); font-size: 0.86rem; color: var(--text-3); font-weight: 500; transition: color 0.3s; letter-spacing: 0; }
  .f-r a:hover { color: var(--text); }

  /* ===== ANIMATIONS ===== */
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== MOBILE ===== */
  @media (max-width: 820px) {
    :root { --gutter: 1.25rem; }
    .nav-inner { padding: 0 1.25rem; height: 62px; }
    .logo { font-size: 1.05rem; }
    .nav-back { font-size: 0.92rem; }
    main { padding: 6rem 1.25rem 4rem; }
    .page-head { gap: 1.1rem; margin-bottom: 2.5rem; }
    .page-index { font-size: 0.74rem; }
    .page-title-block h1 { font-size: 2.4rem; line-height: 1.06; }
    .cta-btn { font-size: 0.96rem; padding: 1rem 1.6rem; }
    footer {
      grid-template-columns: 1fr auto 1fr;
      gap: 1rem;
      padding: 2.2rem 1.25rem calc(2.5rem + env(safe-area-inset-bottom));
    }
    .f-l { font-size: 0.8rem; }
    .f-r a { font-size: 0.8rem; }
    .f-c svg { width: 20px; height: 20px; }
  }
  @media (max-width: 400px) {
    .page-title-block h1 { font-size: 2rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">SG Practice</a>
    <a href="index.html" class="nav-back"><svg viewBox="0 0 16 16"><path d="M13 8H3M7 4L3 8l4 4"/></svg> Back to home</a>
  </div>
</nav>

<main>
  <div class="page-head">
    <div class="page-index">SG / Strategy call</div>
    <div class="page-title-block">
      <h1>Book a call. <span class="h1-thin">We'll see if it's a fit.</span></h1>
    </div>
  </div>

  <div class="cta-wrap">
    <a href="https://calendly.com/contact-sg-practice/strategy-call" target="_blank" rel="noopener" class="cta-btn">
      Open booking page
      <svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </a>
    <div class="cta-note">30 minutes — Calendly</div>
  </div>
</main>

<footer>
  <div class="f-l">© 2026 — SG Practice</div>
  <div class="f-c"><a href="https://www.linkedin.com/company/sgpractice/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a></div>
  <div class="f-r"><a href="mailto:contact@sg-practice.com">contact@sg-practice.com</a></div>
</footer>

</body>
</html>

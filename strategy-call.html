<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Book a strategy call — SG Practice</title>
<meta name="description" content="Book a 30-minute strategy call with SG Practice. We'll audit your pipeline and identify the highest-leverage gaps.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  @font-face {
    font-family: 'HelveticaNowDisplay';
    src: url('HelveticaNowDisplay-Cn.otf') format('opentype');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #FFFFFF;
    --bg-2: #FFFFFF;
    --card: #F0F0F0;
    --border: #E0E0E0;
    --border-2: #BBBBBB;
    --border-hover: #888888;
    --text: #0A0A0A;
    --text-2: #555555;
    --text-3: #999999;
    --text-4: #CCCCCC;
    --accent: #0A0A0A;
    --font-display: 'HelveticaNowDisplay', 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'HelveticaNowDisplay', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'SF Mono', Menlo, Consolas, monospace;
    --container: 1240px;
    --gutter: 2.5rem;
    --nav-h: 72px;
    --foot-h: 80px;
  }

  html { scroll-behavior: smooth; font-size: 16px; height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    font-feature-settings: "ss01", "cv11";
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
  }

  ::selection { background: var(--text); color: var(--bg); }
  a { text-decoration: none; color: inherit; }

  /* ===== NAV ===== */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 0.5px solid transparent;
    transition: border-color 0.5s, background 0.4s;
  }
  nav.scrolled { border-bottom-color: var(--border); }
  .nav-inner {
    max-width: var(--container);
    margin: 0 auto;
    height: var(--nav-h);
    padding: 0 var(--gutter);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    display: inline-flex;
    align-items: baseline;
    gap: 0.45rem;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
    transition: opacity 0.3s;
  }
  .logo:hover { opacity: 0.75; }
  .nav-links { display: flex; gap: 2.4rem; align-items: center; }
  .nav-link { font-size: 0.88rem; font-weight: 400; color: var(--text-3); transition: color 0.3s; letter-spacing: 0.06em; text-transform: uppercase; }
  .nav-link:hover { color: var(--text); }
  .nav-back {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--text);
    background: transparent;
    padding: 0.7rem 1.2rem;
    border: 0.5px solid var(--border-2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: border-color 0.3s, opacity 0.3s;
  }
  .nav-back:hover { border-color: var(--text); opacity: 1; }
  .nav-back svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.75; transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); }
  .nav-back:hover svg { transform: translateX(-3px); }

  /* ===== MOBILE TOGGLE ===== */
  .mobile-toggle { display: none; background: none; border: none; cursor: pointer; padding: 10px; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 13px); right: 1.25rem; z-index: 115; width: 44px; height: 44px; }
  .mobile-toggle span { display: block; width: 22px; height: 1.5px; background: var(--text); margin: 5px auto; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.3s; transform-origin: center; }
  .mobile-toggle.active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .mobile-toggle.active span:nth-child(2) { opacity: 0; }
  .mobile-toggle.active span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
  .mobile-menu { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 105; background: rgba(255,255,255,0.98); backdrop-filter: blur(40px) saturate(140%); -webkit-backdrop-filter: blur(40px) saturate(140%); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: env(safe-area-inset-top, 0) 2rem env(safe-area-inset-bottom, 0); opacity: 0; visibility: hidden; transition: opacity 0.45s cubic-bezier(0.16,1,0.3,1), visibility 0.45s; }
  .mobile-menu.open { opacity: 1; visibility: visible; }
  .mobile-menu a { font-family: var(--font-display); display: block; font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; color: var(--text); padding: 0.6rem 0; opacity: 0; transform: translateY(12px); transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1), transform 0.5s cubic-bezier(0.16,1,0.3,1), color 0.3s; }
  .mobile-menu.open a { opacity: 1; transform: translateY(0); }
  .mobile-menu.open a:nth-of-type(1) { transition-delay: 0.10s; }
  .mobile-menu.open a:nth-of-type(2) { transition-delay: 0.20s; }
  .mobile-menu .mm-foot { position: absolute; bottom: 2.5rem; left: 2rem; right: 2rem; font-size: 0.78rem; color: var(--text-3); opacity: 0; transition: opacity 0.5s 0.45s; font-family: var(--font-mono); letter-spacing: 0; }
  .mobile-menu.open .mm-foot { opacity: 1; }
  body.menu-open { overflow: hidden; }

  /* ===== MAIN ===== */
  main {
    position: relative;
    z-index: 2;
    max-width: var(--container);
    width: 100%;
    margin: 0 auto;
    padding: calc(var(--nav-h) + 2rem) var(--gutter) 2rem;
  }

  /* ===== PAGE HEADER ===== */
  .page-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.4rem;
    margin-bottom: 1.75rem;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
  }
  .page-index {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-4);
    white-space: nowrap;
  }
  .page-title-block h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 4vw, 3.2rem);
    line-height: 1.0;
    letter-spacing: -0.055em;
    color: var(--text);
    margin-top: 0.4rem;
  }
  .page-title-block h1 .h1-thin {
    font-weight: 400;
    color: #3a3a3a;
  }
  .page-body {
    font-size: 1.08rem;
    font-weight: 400;
    line-height: 1.7;
    color: var(--text-2);
    max-width: 480px;
    letter-spacing: -0.005em;
    margin-top: 0.4rem;
  }

  /* ===== CALENDLY WRAPPER ===== */
  .booking-wrap {
    position: relative;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    overflow: hidden;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    border: 0.5px solid var(--border);
  }
  .calendly-inline-widget {
    width: 100% !important;
    margin: 0 auto;
    min-width: 320px;
    height: calc(100vh - var(--nav-h) - 10rem) !important;
    min-height: 580px;
    box-shadow: none !important;
    filter: none !important;
    overflow: hidden !important;
  }
  .calendly-inline-widget iframe {
    width: 100% !important;
    height: 100% !important;
    box-shadow: none !important;
    filter: none !important;
    border: none !important;
    overflow: hidden !important;
    scrollbar-width: none !important;
  }
  .calendly-inline-widget iframe::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

  /* ===== FOOTER ===== */
  footer {
    max-width: var(--container);
    margin: 0 auto;
    padding: 1.5rem var(--gutter);
    border-top: 0.5px solid var(--border);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 2rem;
  }
  .f-l { font-family: var(--font-mono); font-size: 0.86rem; color: var(--text-3); font-weight: 500; letter-spacing: 0; text-transform: uppercase; }
  .f-c { display: flex; justify-content: center; }
  .f-c a { color: var(--text-3); transition: color 0.3s; display: flex; align-items: center; }
  .f-c a:hover { color: var(--text); }
  .f-c svg { width: 20px; height: 20px; fill: currentColor; }
  .f-r { text-align: right; }
  .f-r a { font-family: var(--font-mono); font-size: 0.86rem; color: var(--text-3); font-weight: 500; transition: color 0.3s; letter-spacing: 0; }
  .f-r a:hover { color: var(--text); }

  /* ===== ANIMATIONS ===== */
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== MOBILE ===== */
  @media (max-width: 820px) {
    :root { --gutter: 1.25rem; --nav-h: 62px; }
    .nav-inner { padding: 0 1.25rem; }
    .nav-links { display: none; }
    .mobile-toggle { display: block; }
    main { padding: calc(var(--nav-h) + 3rem) 1.25rem 3rem; }
    .page-head { gap: 0.65rem; margin-bottom: 2.5rem; }
    .page-index { font-size: 0.68rem; }
    .page-title-block h1 { font-size: 1.75rem; letter-spacing: -0.038em; }
    .booking-wrap { max-width: 100%; }
    .calendly-inline-widget { height: 680px !important; min-height: 680px; }
    footer { grid-template-columns: 1fr; text-align: center; gap: 1.2rem; padding: 2.2rem 1.25rem 3rem; }
    .f-r { text-align: center; }
    .f-l { font-size: 0.8rem; }
    .f-r a { font-size: 0.8rem; }
  }
  @media (max-width: 400px) {
    .page-title-block h1 { font-size: 1.5rem; }
    .calendly-inline-widget { height: 620px !important; min-height: 620px; }
  }
</style>
</head>
<body>

<nav id="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">SG Practice</a>
    <div class="nav-links">
      <a href="index.html#services" class="nav-link">Services</a>
      <a href="index.html#results" class="nav-link">Selected Work</a>
      <a href="index.html#system" class="nav-link">The Build</a>
      <a href="index.html#process" class="nav-link">Process</a>
      <a href="strategy-call.html" class="nav-back"><svg viewBox="0 0 16 16"><path d="M13 8H3M7 4L3 8l4 4"/></svg> Back to home</a>
    </div>
  </div>
</nav>
<button class="mobile-toggle" id="mobileToggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>

<div class="mobile-menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Main menu">
  <a href="index.html#services">Services</a>
  <a href="index.html">Back to home</a>
  <div class="mm-foot">contact@sg-practice.com</div>
</div>

<main>
  <div class="page-head">
    <div class="page-index">SG / Strategy call</div>
    <div class="page-title-block">
      <h1>Book a call. <span class="h1-thin">We'll see if it's a fit.</span></h1>
    </div>
  </div>

  <div class="booking-wrap">
    <!-- Calendly inline widget begin -->
    <div class="calendly-inline-widget" data-url="https://calendly.com/contact-sg-practice/strategy-call?background_color=ffffff&text_color=0a0a0a&primary_color=0a0a0a&hide_gdpr_banner=1" style="min-width:320px;"></div>
    <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
    <script>
      (function() {
        var attempts = 0;
        var iv = setInterval(function() {
          var iframe = document.querySelector('.calendly-inline-widget iframe');
          if (iframe) {
            iframe.setAttribute('scrolling', 'no');
            iframe.style.overflow = 'hidden';
            clearInterval(iv);
          }
          if (++attempts > 40) clearInterval(iv);
        }, 250);
      })();
    </script>
    <!-- Calendly inline widget end -->
  </div>
</main>

<footer>
  <div class="f-l">© 2026 — SG Practice</div>
  <div class="f-c"><a href="https://www.linkedin.com/company/sgpractice/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a></div>
  <div class="f-r"><a href="mailto:contact@sg-practice.com">contact@sg-practice.com</a></div>
</footer>

<script>
  var nav = document.getElementById('nav');
  window.addEventListener('scroll', function() { nav.classList.toggle('scrolled', window.scrollY > 32); }, { passive: true });

  var mobileToggle = document.getElementById('mobileToggle');
  var mobileMenu = document.getElementById('mobileMenu');
  function setMenu(open) {
    mobileToggle.classList.toggle('active', open);
    mobileMenu.classList.toggle('open', open);
    document.body.classList.toggle('menu-open', open);
    mobileToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  mobileToggle.addEventListener('click', function() { setMenu(!mobileMenu.classList.contains('open')); });
  mobileMenu.querySelectorAll('a').forEach(function(link) { link.addEventListener('click', function() { setMenu(false); }); });
  mobileMenu.addEventListener('click', function(e) { if (e.target === mobileMenu) setMenu(false); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && mobileMenu.classList.contains('open')) setMenu(false); });
  window.addEventListener('resize', function() { if (window.innerWidth > 820 && mobileMenu.classList.contains('open')) setMenu(false); });
</script>
</body>
</html>
